name: Runtime smoke create record

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  create-record-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Reset ADB before emulator
        shell: bash
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" kill-server || true
          sleep 2
          "$ADB" start-server
          "$ADB" version

      - name: Reproduce create-record flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/runtime-smoke-create-record.sh
