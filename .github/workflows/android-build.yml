name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run preview unit tests
        run: gradle :app:testPreviewUnitTest --stacktrace

      - name: Run Android lint for preview
        run: gradle :app:lintPreview --stacktrace

      - name: Build preview APK
        run: gradle :app:assemblePreview --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Instrumented startup tests and direct launch on Android 10
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            trap 'adb logcat -d -v threadtime > startup-logcat.txt 2>/dev/null || true' 0

            gradle :app:connectedPreviewAndroidTest --stacktrace

            APK="app/build/outputs/apk/preview/app-preview.apk"
            PACKAGE="com.yomismtz.expedientedeldentista.preview"
            ACTIVITY="com.yomismtz.expedientedeldentista.MainActivity"

            adb install -r "$APK"
            adb shell pm clear "$PACKAGE" || true
            adb logcat -c
            adb shell am start -W -n "$PACKAGE/$ACTIVITY"
            sleep 8

            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "::error::The Preview process died during startup."
              adb logcat -d -v time | grep -E 'expedientedeldentista|FATAL EXCEPTION|AndroidRuntime|Process:' | tail -n 300 || true
              exit 1
            fi

            echo "Preview process is alive after launch: PID=$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|expedientedeldentista' | head -n 30 || true

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-logcat
          path: startup-logcat.txt
          if-no-files-found: ignore
