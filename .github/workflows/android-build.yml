name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run preview unit tests
        run: gradle :app:testPreviewUnitTest --stacktrace

      - name: Run Android lint for preview
        run: gradle :app:lintPreview --stacktrace

      - name: Build preview APK
        run: gradle :app:assemblePreview --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
