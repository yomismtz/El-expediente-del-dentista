name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run preview unit tests
        run: gradle :app:testPreviewUnitTest --stacktrace

      - name: Run Android lint for preview
        run: gradle :app:lintPreview --stacktrace

      - name: Build preview APK
        run: gradle :app:assemblePreview --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

  compatibility:
    name: Smoke ${{ matrix.label }} · API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-9
            api: 28
          - label: android-10
            api: 29
          - label: android-11
            api: 30
          - label: android-12
            api: 31
          - label: android-13
            api: 33
          - label: android-14
            api: 34
          - label: android-15
            api: 35
          - label: android-16
            api: 36
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download preview APK
        uses: actions/download-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and keep Preview alive
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-startup-smoke.sh

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat-${{ matrix.label }}-api-${{ matrix.api }}
          path: startup-logcat.txt
          if-no-files-found: ignore
