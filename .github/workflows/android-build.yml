name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run preview unit tests
        run: gradle :app:testPreviewUnitTest --stacktrace

      - name: Run Android lint for preview
        run: gradle :app:lintPreview --stacktrace

      - name: Build preview APK
        run: gradle :app:assemblePreview --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Direct startup smoke test on Android 10
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-startup-smoke.sh

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-logcat
          path: startup-logcat.txt
          if-no-files-found: ignore
