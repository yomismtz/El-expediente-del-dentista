name: Android build
# compile step19
# compile complete step18
# compile step18 request budget
# compile step17 activities calculators protocols
# compile step15 diagnostic auxiliaries
# final compile step14 offline mucosa atlas
# compile step14 offline zoom viewer
# rebuild step13 visual help syntax fix
# compile step13 elementary lesions illustration
# rebuild step13 no typing preset options
# compile step13 interactive oral mucosa
# rebuild step12 fix LazyRow
# compile step12 orthodontics dental anomalies
# compile step11 complete occlusion
# compile step10 real clinical images
# compile step9 head neck ATM
# compile step8 physical vitals
# compile step7
# compile step6 APP 8 diseases
# compile step5 gyneco
# rebuild step4 syntax fix
# compile step4 APNP final
# rebuild step3 five diseases per category
# compile step3 hereditary family history
# compile colloquial translator v42
