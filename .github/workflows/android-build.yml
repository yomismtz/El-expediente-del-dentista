on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore when configured
        if: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build debug APK and release artifacts
        env:
          RELEASE_STORE_FILE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle clean :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-build-cache --rerun-tasks --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove restored release keystore
        if: always()
        run: rm -f app/release.keystore

