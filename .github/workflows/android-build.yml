name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run preview unit tests
        run: gradle :app:testPreviewUnitTest --stacktrace

      - name: Run Android lint for preview
        run: gradle :app:lintPreview --stacktrace

      - name: Build preview APK
        run: gradle :app:assemblePreview --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: El-expediente-del-dentista-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Run direct startup smoke test on Android 10
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-29;google_apis;x86_64"
          echo no | avdmanager create avd --force --name ci-api29 --package "system-images;android-29;google_apis;x86_64"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ci-api29 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          APK="app/build/outputs/apk/preview/app-preview.apk"
          PACKAGE="com.yomismtz.expedientedeldentista.preview"
          ACTIVITY="com.yomismtz.expedientedeldentista.MainActivity"

          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop "$PACKAGE" || true
          adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 6

          PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
          if [ -z "$PID" ]; then
            echo "::error::The Preview process died during startup."
            echo "===== AndroidRuntime ====="
            adb logcat -d -v time 'AndroidRuntime:E' '*:S' || true
            echo "===== ActivityTaskManager / ActivityManager ====="
            adb logcat -d -v time 'ActivityTaskManager:E' 'ActivityManager:E' '*:S' || true
            echo "===== Recent app-related logcat ====="
            adb logcat -d -v time | grep -E 'expedientedeldentista|FATAL EXCEPTION|AndroidRuntime|Process:' | tail -n 250 || true
            exit 1
          fi

          echo "Preview process is alive after launch: PID=$PID"
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|expedientedeldentista' | head -n 30 || true

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-log
          path: emulator.log
          if-no-files-found: ignore
