name: Publicar web y APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build latest APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare public site
        run: |
          mkdir -p website/downloads
          cp app/build/outputs/apk/debug/app-debug.apk website/downloads/El-expediente-del-dentista.apk
          touch website/.nojekyll
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              "commit": os.environ.get("GITHUB_SHA", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "builtAt": datetime.now(timezone.utc).isoformat()
          }
          with open("website/build-info.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
